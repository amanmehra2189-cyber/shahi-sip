<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shahi Sip - Royal Refreshment</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <style>
    :root {
      --gold: #c5a059;
      --dark-gold: #9e7e43;
      --black: #0f0f0f;
      --soft-white: #f9f9f9;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    body { 
      margin: 0; 
      font-family: 'Poppins', sans-serif; 
      background-color: var(--soft-white); 
      color: #333; 
      scroll-behavior: smooth;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    .navbar { 
      background-color: var(--black); 
      display: flex; 
      justify-content: center; 
      align-items: center; 
      padding: 12px 16px; 
      border-bottom: 3px solid var(--gold); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
      position: sticky;
      top: 0;
      z-index: 500;
    }

    .logo img { 
      height: 48px; 
      max-width: 100%;
      object-fit: contain;
      transition: transform 0.2s; 
    }
    
    @media (min-width: 768px) {
      .logo img { height: 60px; }
      .navbar { padding: 15px 5%; }
    }

    .logo img:hover { transform: scale(1.05); }

    /* Hero Banner displaying shoe.jpg */
    .hero { 
      position: relative; 
      width: 100%;
      height: 260px; 
      background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), 
                  url('shoe.jpg') center/cover no-repeat; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      text-align: center;
      box-shadow: inset 0 -10px 20px rgba(0,0,0,0.4);
    }

    @media (min-width: 768px) {
      .hero {
        height: 420px;
      }
    }

    .products { 
      padding: 40px 16px; 
      text-align: center; 
      background-color: var(--soft-white); 
    }

    .products h2 { 
      font-family: 'Cinzel', serif; 
      font-size: 1.8rem; 
      color: var(--black); 
      margin: 0 0 30px;
      position: relative;
      display: inline-block;
      line-height: 1.3;
    }

    .products h2::after { 
      content: ''; 
      display: block; 
      width: 50px; 
      height: 3px; 
      background: var(--gold); 
      margin: 10px auto 0; 
    }

    .product-grid { 
      display: flex; 
      justify-content: center; 
      gap: 24px; 
      flex-wrap: wrap; 
      width: 100%;
    }
    
    .product-card { 
      background-color: var(--black); 
      border: 1px solid var(--gold); 
      padding: 30px 20px; 
      width: 100%;
      max-width: 340px; 
      color: #fff; 
      border-radius: 16px; 
      transition: all 0.3s ease;
      box-shadow: 0 10px 25px rgba(0,0,0,0.12);
    }

    .product-card:hover { 
      transform: translateY(-6px); 
      box-shadow: 0 16px 32px rgba(197, 160, 89, 0.25); 
    }

    .product-card img { 
      width: 100%; 
      max-width: 220px; 
      height: auto; 
      margin: 0 auto 20px; 
      display: block; 
      border-radius: 8px; 
    }

    .product-card h3 { 
      font-family: 'Cinzel', serif; 
      font-size: 1.25rem; 
      letter-spacing: 0.5px; 
      margin: 0 0 10px;
    }

    .price { 
      font-size: 2.2rem; 
      color: var(--gold); 
      font-weight: 600; 
      margin: 10px 0 20px; 
    }
    
    .btn-gold { 
      background: linear-gradient(135deg, var(--gold), #e0c07e); 
      color: #000; 
      border: none; 
      padding: 14px 20px; 
      font-weight: 700; 
      text-transform: uppercase; 
      cursor: pointer; 
      border-radius: 50px; 
      width: 100%; 
      font-size: 0.95rem; 
      transition: 0.2s; 
      letter-spacing: 1px; 
      touch-action: manipulation;
    }

    .btn-gold:active { 
      transform: scale(0.98); 
    }

    .modal-overlay { 
      display: none; 
      position: fixed; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      background: rgba(0,0,0,0.85); 
      backdrop-filter: blur(5px); 
      z-index: 2000; 
      justify-content: center; 
      align-items: center; 
      padding: 16px;
    }

    .phone-mockup { 
      width: 100%; 
      max-width: 440px; 
      max-height: 90vh; 
      display: flex; 
      flex-direction: column; 
      background-color: #fff; 
      border-radius: 20px; 
      overflow: hidden; 
      position: relative; 
      box-shadow: 0 25px 50px rgba(0,0,0,0.5); 
      animation: modalSlide 0.3s ease-out; 
    }

    @keyframes modalSlide { 
      from { transform: translateY(20px); opacity: 0; } 
      to { transform: translateY(0); opacity: 1; } 
    }

    .form-container { 
      padding: 30px 20px 25px; 
      overflow-y: auto; 
      -webkit-overflow-scrolling: touch; 
      color: #333; 
    }

    .form-group { 
      margin-bottom: 16px; 
      text-align: left;
    }

    label { 
      display: block; 
      font-size: 11px; 
      color: #777; 
      text-transform: uppercase; 
      letter-spacing: 0.8px; 
      margin-bottom: 6px; 
      font-weight: 600;
    }
    
    input { 
      width: 100%; 
      padding: 12px 14px; 
      border: 1px solid #ddd; 
      border-radius: 8px; 
      background: #fafafa; 
      font-family: inherit; 
      font-size: 16px; 
      transition: border 0.2s, background 0.2s; 
    }

    input:focus { 
      outline: none; 
      border-color: var(--gold); 
      background: #fff; 
    }

    .pincode-city-row { 
      display: grid; 
      grid-template-columns: 1fr 1fr; 
      gap: 12px; 
    }

    .close-modal { 
      position: absolute; 
      top: 10px; 
      right: 15px; 
      width: 36px; 
      height: 36px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      font-size: 30px; 
      cursor: pointer; 
      color: #777; 
      transition: color 0.2s; 
      z-index: 10;
    }

    .close-modal:hover, .close-modal:active { color: var(--gold); }

    @media (max-width: 380px) {
      .pincode-city-row {
        grid-template-columns: 1fr;
        gap: 0;
      }
      .form-container {
        padding: 25px 15px 20px;
      }
    }

    @media (min-width: 768px) {
      .products { padding: 70px 5%; }
      .products h2 { font-size: 2.4rem; }
      .product-card { max-width: 320px; padding: 40px 25px; }
      .product-card h3 { font-size: 1.4rem; }
      .price { font-size: 2.8rem; }
      .form-container { padding: 40px 30px; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo"><img src="logo.jpg" alt="Logo"/></div>
  </header>

  <!-- Hero Section loading shoe.jpg -->
  <section class="hero" aria-label="Showcase Banner"></section>

  <section class="products">
    <h2>Select Your Refreshment</h2>
    <div class="product-grid">
      <div class="product-card">
        <img src="product.jpg" alt="400ml"/>
        <h3>400ml SHAHI SIP</h3>
        <p class="price">₹19</p>
        <button type="button" class="btn-gold" onclick="openOrderForm('400ml Shahi Sip', 19)">Order Now</button>
      </div>
      <div class="product-card">
        <img src="product.jpg" alt="800ml"/>
        <h3>800ml SHAHI SIP</h3>
        <p class="price">₹299</p>
        <button type="button" class="btn-gold" onclick="openOrderForm('800ml Shahi Sip', 299)">Order Now</button>
      </div>
    </div>
  </section>

  <div class="modal-overlay" id="orderModal">
    <div class="phone-mockup">
      <span class="close-modal" onclick="closeOrderForm()">&times;</span>
      <div class="form-container">
        <h3 id="selectedProduct" style="margin-top:0; margin-bottom: 5px; color:var(--dark-gold); font-family: 'Cinzel', serif; font-size: 1.3rem;">Address Details</h3>
        <p style="font-size: 13px; color: #666; margin-top: 0; margin-bottom: 20px;">Enter your delivery details below</p>
        
        <form id="orderForm" onsubmit="handleOrder(event)">
          <div class="form-group">
            <label for="custName">Full Name</label>
            <input type="text" id="custName" placeholder="Your Name" required autocomplete="name">
          </div>
          <div class="form-group">
            <label for="custPhone">Phone Number</label>
            <input type="tel" id="custPhone" placeholder="9876543210" pattern="[0-9]{10}" inputmode="numeric" required autocomplete="tel">
          </div>
          <div class="form-group">
            <label>Delivery Address</label>
            <input type="text" id="custLandmark" placeholder="Flat, Building, Landmark (Optional)" style="margin-bottom:10px;">
            <input type="text" id="custVillage" placeholder="Area, Street, Village" required style="margin-bottom:10px;">
            <input type="text" id="custDistrict" placeholder="District" required>
          </div>
          <div class="pincode-city-row">
            <div class="form-group">
              <label for="custState">State</label>
              <input type="text" id="custState" placeholder="State" required>
            </div>
            <div class="form-group">
              <label for="custPincode">Pincode</label>
              <input type="tel" id="custPincode" placeholder="123456" pattern="[0-9]{6}" inputmode="numeric" required autocomplete="postal-code">
            </div>
          </div>
          <button type="submit" class="btn-gold" style="margin-top:10px; padding: 15px;">Confirm & Pay</button>
        </form>
      </div>
    </div>
  </div>

  <script>
    let currentPrice = 0;
    let currentProduct = "";

    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxvlrFG4w-1AsnNPmUvXFSW55CT5KStauI1kD_9lekZLGh30yv_j6e2CovkhSAD-2h4/exec";
    const RAZORPAY_KEY = "rzp_live_TWeazc0v6oJu3p";

    function openOrderForm(productName, price) {
      currentPrice = price;
      currentProduct = productName;
      document.getElementById('orderModal').style.display = 'flex';
      document.getElementById('selectedProduct').innerText = productName;
      document.body.style.overflow = 'hidden';
    }

    function closeOrderForm() {
      document.getElementById('orderModal').style.display = 'none';
      document.body.style.overflow = '';
    }

    function handleOrder(event) {
      event.preventDefault();

      const orderPayload = {
        timestamp: new Date().toLocaleString("en-IN", { timeZone: "Asia/Kolkata" }),
        product: currentProduct,
        price: currentPrice,
        name: document.getElementById('custName').value.trim(),
        phone: document.getElementById('custPhone').value.trim(),
        landmark: document.getElementById('custLandmark').value.trim(),
        village: document.getElementById('custVillage').value.trim(),
        district: document.getElementById('custDistrict').value.trim(),
        state: document.getElementById('custState').value.trim(),
        pincode: document.getElementById('custPincode').value.trim()
      };

      const options = {
        "key": RAZORPAY_KEY,
        "amount": currentPrice * 100,
        "currency": "INR",
        "name": "Shahi Sip",
        "description": "Payment for " + currentProduct,
        "image": "logo.jpg",
        "handler": function (response) {
          orderPayload.payment_id = response.razorpay_payment_id;

          fetch(GOOGLE_SCRIPT_URL, {
            method: "POST",
            mode: "no-cors",
            headers: {
              "Content-Type": "text/plain;charset=utf-8"
            },
            body: JSON.stringify(orderPayload)
          })
          .then(() => {
            alert("Order Placed Successfully!\nPayment ID: " + response.razorpay_payment_id);
            document.getElementById('orderForm').reset();
            closeOrderForm();
          })
          .catch((err) => {
            console.error("Sheet sync failed: ", err);
            alert("Payment complete! Reference ID: " + response.razorpay_payment_id);
            closeOrderForm();
          });
        },
        "prefill": {
          "name": orderPayload.name,
          "contact": orderPayload.phone
        },
        "theme": {
          "color": "#c5a059"
        }
      };

      const rzp1 = new Razorpay(options);
      
      rzp1.on('payment.failed', function (response) {
        alert("Payment Failed: " + response.error.description);
      });

      rzp1.open();
    }

    window.onclick = function(event) {
      const modal = document.getElementById('orderModal');
      if (event.target === modal) {
        closeOrderForm();
      }
    };
  </script>
</body>
</html>
